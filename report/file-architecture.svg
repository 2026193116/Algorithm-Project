<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880" role="img" aria-labelledby="title desc">
  <title id="title">실험 코드 및 결과 파일 구성</title>
  <desc id="desc">C와 Python 실험 코드의 구조, make test가 실행하는 테스트 파일과 사전 점검, 결과 CSV의 통합·검증·시각화 구성을 보여 주는 구조도.</desc>
  <defs>
    <style>
      text{font-family:Arial,'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#526078}
      .head{font-size:16px;font-weight:700}.label{font-size:13px;font-weight:700}
      .small{font-size:12px;fill:#3e4b61}.tiny{font-size:11px;fill:#526078}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.c{fill:#eaf3ff;stroke:#77a9e8;stroke-width:1.5}
      .py{fill:#eaf8f1;stroke:#70bf92;stroke-width:1.5}.shared{fill:#f4f1ff;stroke:#a99add;stroke-width:1.5}
      .output{fill:#fff7e8;stroke:#e3b45e;stroke-width:1.5}.line{fill:none;stroke:#68758a;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#8894a8;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#68758a"/></marker>
  </defs>
  <rect width="1100" height="880" rx="18" fill="#fbfcfe"/>
  <text x="550" y="42" text-anchor="middle" class="title">실험 파일의 유기적 구성</text>
  <text x="550" y="67" text-anchor="middle" class="subtitle">언어별 실행부 → 공통 연산 역할 → 결과 통합·검증·그래프</text>

  <rect x="35" y="95" width="300" height="335" rx="14" fill="#f5f9ff" stroke="#d5e5f7"/>
  <text x="185" y="124" text-anchor="middle" class="head">C 실행 경로</text>
  <rect x="70" y="145" width="230" height="55" rx="10" class="c"/>
  <text x="185" y="169" text-anchor="middle" class="label">src/main.c</text><text x="185" y="188" text-anchor="middle" class="small">실험 조건 반복 · 결과 정확성 검증</text>
  <rect x="70" y="225" width="230" height="55" rx="10" class="c"/>
  <text x="185" y="249" text-anchor="middle" class="label">src/data_generator.c / .h</text><text x="185" y="268" text-anchor="middle" class="small">행렬 생성 · 구조 · 희소도</text>
  <rect x="70" y="305" width="230" height="74" rx="10" class="c"/>
  <text x="185" y="329" text-anchor="middle" class="label">src/dense.c · csr.c · csc.c</text><text x="185" y="350" text-anchor="middle" class="small">Dense / CSR / CSC 변환·MatVec</text><text x="185" y="368" text-anchor="middle" class="tiny">각 구현의 .h 파일이 인터페이스 제공</text>
  <rect x="70" y="395" width="230" height="55" rx="10" class="c"/>
  <text x="185" y="419" text-anchor="middle" class="label">src/benchmark.c / .h</text><text x="185" y="438" text-anchor="middle" class="small">시간·메모리 측정</text>
  <path d="M185 200 V225 M185 280 V305 M185 379 V395" class="line"/>

  <rect x="35" y="465" width="300" height="190" rx="14" fill="#f3fbf6" stroke="#d3eddd"/>
  <text x="185" y="494" text-anchor="middle" class="head">Python 실행 경로</text>
  <rect x="70" y="515" width="230" height="55" rx="10" class="py"/>
  <text x="185" y="539" text-anchor="middle" class="label">src/main.py</text><text x="185" y="558" text-anchor="middle" class="small">실험 조건 반복 · 검증 · 결과 기록</text>
  <rect x="70" y="590" width="230" height="55" rx="10" class="py"/>
  <text x="185" y="614" text-anchor="middle" class="label">data_generator.py · dense.py</text><text x="185" y="633" text-anchor="middle" class="small">csr.py · csc.py · benchmark.py</text>
  <path d="M185 570 V590" class="line"/>

  <rect x="390" y="130" width="295" height="120" rx="14" class="shared"/>
  <text x="537" y="158" text-anchor="middle" class="head">공통 실험 입력과 연산</text>
  <text x="537" y="185" text-anchor="middle" class="small">행렬 A · 벡터 x · 조건(크기, density, 구조)</text>
  <text x="537" y="207" text-anchor="middle" class="small">Dense 기준 결과와 CSR/CSC 결과 비교</text>
  <text x="537" y="229" text-anchor="middle" class="tiny">C와 Python은 각각 동일한 실험 규칙을 구현</text>
  <path d="M300 172 H390" class="dash"/><path d="M300 542 H350 V220 H390" class="dash"/>

  <rect x="390" y="290" width="295" height="105" rx="14" class="output"/>
  <text x="537" y="320" text-anchor="middle" class="head">언어별 원시 결과</text>
  <text x="537" y="348" text-anchor="middle" class="small">report/c_structure_results.csv</text>
  <text x="537" y="372" text-anchor="middle" class="small">report/python_structure_results.csv</text>
  <path d="M537 250 V290" class="line"/>

  <rect x="750" y="135" width="300" height="68" rx="12" class="box"/>
  <text x="900" y="163" text-anchor="middle" class="label">src/merge_results.py</text><text x="900" y="185" text-anchor="middle" class="small">두 CSV를 combined_structure_results.csv로 통합</text>
  <rect x="750" y="245" width="300" height="68" rx="12" class="box"/>
  <text x="900" y="273" text-anchor="middle" class="label">src/validate_results.py</text><text x="900" y="295" text-anchor="middle" class="small">조건·NNZ·Density·정확성 검증 요약</text>
  <rect x="750" y="355" width="300" height="68" rx="12" class="box"/>
  <text x="900" y="383" text-anchor="middle" class="label">src/plot_results.py</text><text x="900" y="405" text-anchor="middle" class="small">통합 CSV에서 비교 그래프 생성</text>
  <path d="M685 322 H720 V169 H750" class="line"/>
  <path d="M900 203 V245" class="line"/>
  <path d="M900 313 V355" class="line"/>
  <path d="M685 345 H725 V279 H750" class="dash"/>

  <rect x="750" y="470" width="300" height="78" rx="12" class="output"/>
  <text x="900" y="501" text-anchor="middle" class="label">report/combined_structure_results.csv</text><text x="900" y="526" text-anchor="middle" class="small">분석·검증의 통합 입력 데이터</text>
  <path d="M900 423 V470" class="line"/>
  <path d="M750 279 H710 V509 H750" class="dash"/>

  <rect x="750" y="585" width="300" height="78" rx="12" class="output"/>
  <text x="900" y="616" text-anchor="middle" class="label">figures/</text><text x="900" y="641" text-anchor="middle" class="small">time · memory · structure · language 그래프</text>
  <path d="M900 548 V585" class="line"/>

  <rect x="35" y="690" width="1015" height="135" rx="14" fill="#f8f6ff" stroke="#ded7f4"/>
  <text x="542" y="719" text-anchor="middle" class="head">실행 전 점검 · make test</text>
  <rect x="75" y="740" width="390" height="62" rx="10" class="c"/>
  <text x="270" y="765" text-anchor="middle" class="label">tests/test.c</text>
  <text x="270" y="786" text-anchor="middle" class="small">C 구문 검사 · Dense/CSR/CSC · 행렬 생성</text>
  <rect x="620" y="740" width="390" height="62" rx="10" class="py"/>
  <text x="815" y="765" text-anchor="middle" class="label">tests/test.py</text>
  <text x="815" y="786" text-anchor="middle" class="small">Python 구문 검사 · 행렬 연산 · 생성기</text>
  <path d="M465 771 H620" class="line"/>

  <text x="550" y="855" text-anchor="middle" class="tiny">테스트 통과 후 실험을 실행합니다. report/는 결과를 보관하고 figures/는 결과를 시각화합니다.</text>
</svg>
