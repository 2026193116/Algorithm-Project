155" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text x="1155.0" y="476" text-anchor="middle" class="head">6. 결과 CSV</text><text x="1155.0" y="512" text-anchor="middle" class="small">python_structure_results.csv</text><text x="1155.0" y="540" text-anchor="middle" class="small">python_density_results.csv</text><path d="M430 238 L500 238" class="arrow"/><path d="M885 238 L955 238" class="arrow"/><path d="M1155 325 L1155 395 L245 395 L245 428" class="arrow"/><path d="M430 518 L500 518" class="arrow"/><path d="M885 518 L955 518" class="arrow"/><rect x="70" y="680" width="1260" height="105" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="105" y="720" class="head">파일 간 유기성</text><text x="105" y="755" class="txt">main 스크립트가 생성기·계산기·벤치마크를 조합하고, 검증을 통과한 결과만 CSV에 기록한다.</text></svg>