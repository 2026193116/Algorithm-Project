<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#202938} .title{font-size:25px;font-weight:700} .sub{font-size:15px;fill:#5b6574} .label{font-size:17px;font-weight:600} .small{font-size:14px} .box{fill:#f3f6fa;stroke:#52647a;stroke-width:2} .blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2} .green{fill:#dcfce7;stroke:#15803d;stroke-width:2} .orange{fill:#ffedd5;stroke:#c2410c;stroke-width:2} .line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)} </style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
