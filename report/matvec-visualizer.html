<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>행렬-벡터 곱셈 작동 과정</title>
<style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#172033;background:#f5f7fb}body{margin:0;padding:24px}.wrap{max-width:1050px;margin:auto}.panel{background:white;border:1px solid #d9e0ea;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #1720330a}h1{margin:0 0 8px}.muted{color:#637083}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{padding:9px 13px;border:1px solid #b9c5d4;border-radius:8px;background:#fff;font-size:14px}button.primary{background:#1d4ed8;color:white;border-color:#1d4ed8}button:disabled{opacity:.4}.matrix{display:grid;gap:5px;grid-template-columns:repeat(4,54px);margin:10px 0}.cell{border:1px solid #cbd5e1;border-radius:6px;padding:12px 4px;text-align:center;background:#f8fafc}.cell.active{background:#dbeafe;border-color:#2563eb;font-weight:700}.cell.zero{color:#a0a9b6}.row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}.vector{display:flex;gap:5px;flex-direction:column}.vector div{padding:10px;border:1px solid #cbd5e1;border-radius:6px;min-width:50px;text-align:center}.status{font-size:18px;font-weight:650}.step{background:#eff6ff;border-left:4px solid #2563eb;padding:12px;border-radius:6px;min-height:46px}.tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:20px;padding:4px 9px;font-size:12px}
</style></head><body><main class="wrap"><h1>행렬-벡터 곱셈 작동 과정</h1><p class="muted">동일한 4×4 행렬과 벡터를 Dense, CSR, CSC 방식으로 계산하는 흐름을 단계별로 확인합니다.</p>
<section class="panel controls"><label>저장 방식 <select id="mode"><option value="Dense">Dense</option><option value="CSR">CSR</option><option value="CSC">CSC</option></select></label><button id="prev">이전 단계</button><button class="primary" id="next">다음 단계</button><button id="reset">처음으로</button><span id="counter" class="tag"></span></section>
<section class="panel"><div class="row"><div><h3>행렬 A</h3><div id="matrix" class="matrix"></div></div><div><h3>벡터 x</h3><div id="x" class="vector"></div></div><div><h3>결과 벡터 y</h3><div id="y" class="vector"></div></div></div></section>
<section class="panel"><div id="status" class="status"></div><p id="desc" class="step"></p><p id="detail" class="muted"></p></section>
<section class="panel"><h3>저장 배열의 의미</h3><div id="representation"></div></section></main>
<script>
const A=[[2,0,3,0],[0,4,0,1],[5,0,0,0],[0,2,0,6]], x=[1,2,3,4];
const steps={
Dense:[['행 1 계산','y[0] = 2×1 + 0×2 + 3×3 + 0×4 = 11','행의 모든 열을 순서대로 확인합니다.',[0,1,2,3]],['행 2 계산','y[1] = 0×1 + 4×2 + 0×3 + 1×4 = 12','0인 원소도 배열에 존재하므로 곱셈 루프에서 확인합니다.',[4,5,6,7]],['행 3 계산','y[2] = 5×1 = 5','세 번째 행의 내적을 계산합니다.',[8,9,10,11]],['행 4 계산','y[3] = 2×2 + 6×4 = 28','마지막 행까지 계산하면 y = [11, 12, 5, 28]입니다.',[12,13,14,15]]],
CSR:[['row_ptr로 행 범위 확인','row_ptr = [0, 2, 4, 5, 7]','첫 번째 행은 values[0:2], 두 번째 행은 values[2:4]를 사용합니다.',[0,2,3]],['첫 번째 행의 비제로 원소 계산','values=[2,3], col_indices=[0,2] → y[0]=11','0이 아닌 원소만 방문해 해당 열의 x값과 곱합니다.',[0,2]],['두 번째·세 번째 행 계산','y[1]=4×x[1]+1×x[3]=12, y[2]=5×x[0]=5','각 행의 구간을 차례로 처리합니다.',[5,7,8]],['네 번째 행 계산','values[5:7] → y[3]=2×2+6×4=28','모든 행을 처리한 결과는 [11, 12, 5, 28]입니다.',[13,15]]],
CSC:[['col_ptr로 열 범위 확인','col_ptr = [0, 2, 4, 5, 7]','각 열의 비제로 원소 구간을 찾아 열 단위로 순회합니다.',[0,4,8,12]],['첫 번째 열 누적','A[0,0]=2, A[2,0]=5 → y[0]+=2×1, y[2]+=5×1','현재 열 번호가 x의 인덱스가 되고, row_indices가 y의 누적 위치가 됩니다.',[0,8]],['두 번째·세 번째 열 누적','두 번째 열은 y[1]+=4×2, y[3]+=2×2; 세 번째 열은 y[0]+=3×3','열을 순서대로 처리하면서 결과 벡터의 여러 위치에 누적합니다.',[5,13,2]],['네 번째 열 누적 및 완료','y[1]+=1×4, y[3]+=6×4 → y=[11,12,5,28]','모든 열을 순회하면 Dense와 동일한 결과가 완성됩니다.',[7,15]]]
};
let index=0;const mode=document.querySelector('#mode');
function render(){const m=mode.value,s=steps[m][index];document.querySelector('#matrix').innerHTML=A.flatMap((r,i)=>r.map((v,j)=>{let k=i*4+j;return `<div class="cell ${s[3].includes(k)?'active':''} ${v===0?'zero':''}">${v}</div>`})).join('');
document.querySelector('#x').innerHTML=x.map(v=>`<div>${v}</div>`).join('');const partial={Dense:[['11','?','?','?'],['11','12','?','?'],['11','12','5','?'],['11','12','5','28']],CSR:[['?','?','?','?'],['11','?','?','?'],['11','12','5','?'],['11','12','5','28']],CSC:[['0','0','0','0'],['2','0','5','0'],['11','8','5','4'],['11','12','5','28']]};document.querySelector('#y').innerHTML=partial[m][index].map(v=>`<div>${v}</div>`).join('');
document.querySelector('#status').textContent=`${m} · ${s[0]}`;document.querySelector('#desc').textContent=s[1];document.querySelector('#detail').textContent=s[2];document.querySelector('#counter').textContent=`${index+1} / ${steps[m].length}`;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===steps[m].length-1;
document.querySelector('#representation').textContent=m==='Dense'?'A의 4×4 원소를 모두 보관합니다.':m==='CSR'?'values=[2,3,4,1,5,2,6], col_indices=[0,2,1,3,0,1,3], row_ptr=[0,2,4,5,7]':'values=[2,5,4,2,3,1,6], row_indices=[0,2,1,3,0,1,3], col_ptr=[0,2,4,5,7]';}
document.querySelector('#next').onclick=()=>{index=Math.min(index+1,steps[mode.value].length-1);render()};document.querySelector('#prev').onclick=()=>{index=Math.max(0,index-1);render()};document.querySelector('#reset').onclick=()=>{index=0;render()};mode.onchange=()=>{index=0;render()};render();
</script></body></html>
