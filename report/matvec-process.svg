<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#202938} .title{font-size:25px;font-weight:700} .sub{font-size:15px;fill:#5b6574} .label{font-size:17px;font-weight:600} .small{font-size:14px} .box{fill:#f3f6fa;stroke:#52647a;stroke-width:2} .blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2} .green{fill:#dcfce7;stroke:#15803d;stroke-width:2} .orange{fill:#ffedd5;stroke:#c2410c;stroke-width:2} .line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)} </style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text x="500" y="42" text-anchor="middle" class="title">행렬-벡터 곱셈 y = Ax의 진행 과정</text>
<rect x="50" y="100" width="250" height="100" rx="10" class="blue"/><text x="175" y="135" text-anchor="middle" class="label">1. 입력 준비</text><text x="175" y="165" text-anchor="middle" class="small">행렬 A, 벡터 x</text>
<rect x="375" y="100" width="250" height="100" rx="10" class="green"/><text x="500" y="135" text-anchor="middle" class="label">2. 저장 형식 선택</text><text x="500" y="165" text-anchor="middle" class="small">Dense / CSR / CSC</text>
<rect x="700" y="100" width="250" height="100" rx="10" class="orange"/><text x="825" y="135" text-anchor="middle" class="label">3. 곱셈 수행</text><text x="825" y="165" text-anchor="middle" class="small">저장된 원소만 활용</text>
<path d="M300 150 H375 M625 150 H700" class="line"/>
<path d="M825 200 V260 H500 V300" class="line"/>
<rect x="350" y="300" width="300" height="90" rx="10" class="box"/><text x="500" y="335" text-anchor="middle" class="label">4. 결과 벡터 y 생성</text><text x="500" y="365" text-anchor="middle" class="small">각 행의 내적 또는 열 누적</text>
<path d="M500 390 V440" class="line"/><rect x="350" y="440" width="300" height="65" rx="10" class="green"/><text x="500" y="480" text-anchor="middle" class="label">5. Dense 결과와 비교 검증</text></svg>