<text x="430" y="365" class="small">values</text><text x="540" y="365" class="label">5, 2, 3, 7, 8, 4</text>
<text x="430" y="405" class="small">row_indices</text><text x="540" y="405" class="label">0, 2, 1, 2, 0, 3</text>
<text x="430" y="445" class="small">col_ptr</text><text x="540" y="445" class="label">0, 2, 3, 4, 6</text>
<text x="500" y="525" text-anchor="middle" class="sub">희소 형식은 0을 저장하지 않고, 포인터 배열로 행 또는 열의 구간을 찾는다.</text></svg>