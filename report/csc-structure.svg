.title{font-size:30px;font-weight:700;fill:#172033}.sub{font-size:17px;font-weight:500;fill:#475569}
.head{font-size:20px;font-weight:700;fill:#172033}.txt{font-size:17px;font-weight:500;fill:#263449}
.small{font-size:14px;font-weight:500;fill:#475569}.mono{font-family:monospace;font-size:16px;font-weight:600;fill:#172033}
.white{font-size:17px;font-weight:700;fill:#fff}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="700" y="54" text-anchor="middle" class="title">CSC 행렬 저장 구조와 계산 흐름</text>
<text x="700" y="86" text-anchor="middle" class="sub">열(Column)을 기준으로 0이 아닌 원소와 행 인덱스를 압축</text>

<text x="70" y="145" class="head">예시 행렬 A (4×5)</text>
<text x="755" y="145" class="head">CSC 배열: 열별 비제로 원소 압축</text>
<rect x="75" y="185" width="68" height="60" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="109" y="224" text-anchor="middle" class="head">4</text><rect x="150" y="185" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="184" y="224" text-anchor="middle" class="head">0</text><rect x="225" y="185" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="259" y="224" text-anchor="middle" class="head">0</text><rect x="300" y="185" width="68" height="60" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="334" y="224" text-anchor="middle" class="head">7</text><rect x="375" y="185" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="409" y="224" text-anchor="middle" class="head">0</text><rect x="75" y="253" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="109" y="292" text-anchor="middle" class="head">0</text><rect x="150" y="253" width="68" height="60" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="184" y="292" text-anchor="middle" class="head">2</text><rect x="225" y="253" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="259" y="292" text-anchor="middle" class="head">0</text><rect x="300" y="253" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="334" y="292" text-anchor="middle" class="head">0</text><rect x="375" y="253" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="409" y="292" text-anchor="middle" class="head">0</text><rect x="75" y="321" width="68" height="60" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="109" y="360" text-anchor="middle" class="head">5</text><rect x="150" y="321" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="184" y="360" text-anchor="middle" class="head">0</text><rect x="225" y="321" width="68" height="60" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="259" y="360" text-anchor="middle" class="head">3</text><rect x="300" y="321" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="334" y="360" text-anchor="middle" class="head">0</text><rect x="375" y="321" width="68" height="60" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="409" y="360" text-anchor="middle" class="head">1</text><rect x="75" y="389" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="109" y="428" text-anchor="middle" class="head">0</text><rect x="150" y="389" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="184" y="428" text-anchor="middle" class="head">0</text><rect x="225" y="389" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="259" y="428" text-anchor="middle" class="head">0</text><rect x="300" y="389" width="68" height="60" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="334" y="428" text-anchor="middle" class="head">6</text><rect x="375" y="389" width="68" height="60" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8"/><text x="409" y="428" text-anchor="middle" class="head">0</text><text x="109" y="172" text-anchor="middle" class="small">열 0</text><text x="184" y="172" text-anchor="middle" class="small">열 1</text><text x="259" y="172" text-anchor="middle" class="small">열 2</text><text x="334" y="172" text-anchor="middle" class="small">열 3</text><text x="409" y="172" text-anchor="middle" class="small">열 4</text><text x="57" y="222" text-anchor="end" class="small">0</text><text x="57" y="290" text-anchor="end" class="small">1</text><text x="57" y="358" text-anchor="end" class="small">2</text><text x="57" y="426" text-anchor="end" class="small">3</text><text x="80" y="490" class="small">초록색: 0이 아닌 원소  /  회색: 0인 원소</text>
<path d="M470 310 L535 310" class="arrow"/>
<text x="500" y="290" text-anchor="middle" class="small">열 순서로 변환</text>
<text x="760" y="192" class="head">data</text><rect x="760" y="205" width="66" height="54" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="793.0" y="240" text-anchor="middle" class="head">4</text><text x="793.0" y="278" text-anchor="middle" class="small">0</text><rect x="834" y="205" width="66" height="54" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="867.0" y="240" text-anchor="middle" class="head">5</text><text x="867.0" y="278" text-anchor="middle" class="small">1</text><rect x="908" y="205" width="66" height="54" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="941.0" y="240" text-anchor="middle" class="head">2</text><text x="941.0" y="278" text-anchor="middle" class="small">2</text><rect x="982" y="205" width="66" height="54" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="1015.0" y="240" text-anchor="middle" class="head">3</text><text x="1015.0" y="278" text-anchor="middle" class="small">3</text><rect x="1056" y="205" width="66" height="54" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="1089.0" y="240" text-anchor="middle" class="head">7</text><text x="1089.0" y="278" text-anchor="middle" class="small">4</text><rect x="1130" y="205" width="66" height="54" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="1163.0" y="240" text-anchor="middle" class="head">6</text><text x="1163.0" y="278" text-anchor="middle" class="small">5</text><rect x="1204" y="205" width="66" height="54" rx="7" fill="#dcfce7" stroke="#23834a" stroke-width="1.8"/><text x="1237.0" y="240" text-anchor="middle" class="head">1</text><text x="1237.0" y="278" text-anchor="middle" class="small">6</text><text x="760" y="304" class="head">indices</text><rect x="760" y="317" width="66" height="54" rx="7" fill="#dbeafe" stroke="#4f6bed" stroke-width="1.8"/><text x="793.0" y="352" text-anchor="middle" class="head">0</text><text x="793.0" y="390" text-anchor="middle" class="small">0</text><rect x="834" y="317" width="66" height="54" rx="7" fill="#dbeafe" stroke="#4f6bed" stroke-width="1.8"/><text x="867.0" y="352" text-anchor="middle" class="head">2</text><text x="867.0" y="390" text-anchor="middle" class="small">1</text><rect x="908" y="317" width="66" height="54" rx="7" fill="#dbeafe" stroke="#4f6bed" stroke-width="1.8"/><text x="941.0" y="352" text-anchor="middle" class="head">1</text><text x="941.0" y="390" text-anchor="middle" class="small">2</text><rect x="982" y="317" width="66" height="54" rx="7" fill="#dbeafe" stroke="#4f6bed" stroke-width="1.8"/><text x="1015.0" y="352" text-anchor="middle" class="head">2</text><text x="1015.0" y="390" text-anchor="middle" class="small">3</text><rect x="1056" y="317" width="66" height="54" rx="7" fill="#dbeafe" stroke="#4f6bed" stroke-width="1.8"/><text x="1089.0" y="352" text-anchor="middle" class="head">0</text><text x="1089.0" y="390" text-anchor="middle" class="small">4</text><rect x="1130" y="317" width="66" height="54" rx="7" fill="#dbeafe" stroke="#4f6bed" stroke-width="1.8"/><text x="1163.0" y="352" text-anchor="middle" class="head">3</text><text x="1163.0" y="390" text-anchor="middle" class="small">5</text><rect x="1204" y="317" width="66" height="54" rx="7" fill="#dbeafe" stroke="#4f6bed" stroke-width="1.8"/><text x="1237.0" y="352" text-anchor="middle" class="head">2</text><text x="1237.0" y="390" text-anchor="middle" class="small">6</text><text x="760" y="416" class="head">indptr</text><rect x="760" y="429" width="66" height="54" rx="7" fill="#ffedd5" stroke="#c65b22" stroke-width="1.8"/><text x="793.0" y="464" text-anchor="middle" class="head">0</text><text x="793.0" y="502" text-anchor="middle" class="small">0</text><rect x="834" y="429" width="66" height="54" rx="7" fill="#ffedd5" stroke="#c65b22" stroke-width="1.8"/><text x="867.0" y="464" text-anchor="middle" class="head">2</text><text x="867.0" y="502" text-anchor="middle" class="small">1</text><rect x="908" y="429" width="66" height="54" rx="7" fill="#ffedd5" stroke="#c65b22" stroke-width="1.8"/><text x="941.0" y="464" text-anchor="middle" class="head">3</text><text x="941.0" y="502" text-anchor="middle" class="small">2</text><rect x="982" y="429" width="66" height="54" rx="7" fill="#ffedd5" stroke="#c65b22" stroke-width="1.8"/><text x="1015.0" y="464" text-anchor="middle" class="head">4</text><text x="1015.0" y="502" text-anchor="middle" class="small">3</text><rect x="1056" y="429" width="66" height="54" rx="7" fill="#ffedd5" stroke="#c65b22" stroke-width="1.8"/><text x="1089.0" y="464" text-anchor="middle" class="head">6</text><text x="1089.0" y="502" text-anchor="middle" class="small">4</text><rect x="1130" y="429" width="66" height="54" rx="7" fill="#ffedd5" stroke="#c65b22" stroke-width="1.8"/><text x="1163.0" y="464" text-anchor="middle" class="head">7</text><text x="1163.0" y="502" text-anchor="middle" class="small">5</text><text x="760" y="560" class="small">data: 열 순서로 저장한 0이 아닌 실제 값</text>
<text x="760" y="585" class="small">indices: 각 값이 원래 행렬의 몇 번째 행에 있었는지 저장</text>
<text x="760" y="610" class="small">indptr: 각 열의 시작·끝 위치를 지정 (j번째 열은 indptr[j] ~ indptr[j+1]-1)</text>
<rect x="70" y="555" width="610" height="205" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="100" y="595" class="head">CSC 저장 순서</text>
<text x="100" y="632" class="txt">열 0: (행 0, 값 4), (행 2, 값 5)</text>
<text x="100" y="665" class="txt">열 1: (행 1, 값 2)   ·   열 2: (행 2, 값 3)</text>
<text x="100" y="698" class="txt">열 3: (행 0, 값 7), (행 3, 값 6)   ·   열 4: (행 2, 값 1)</text>
<text x="100" y="735" class="small">열별 원소를 차례대로 연결하고, indptr로 각 열의 범위를 구분</text>
<rect x="710" y="650" width="620" height="110" rx="14" fill="#fff7ed" stroke="#c65b22" stroke-width="2"/>
<text x="740" y="687" class="head">행렬-벡터 곱셈</text>
<text x="740" y="721" class="txt">각 열 j의 저장 구간을 순회하며 y[indices[k]] += data[k] × x[j]</text>
<text x="740" y="746" class="small">저장 공간 O(NNZ + n), 계산 시간 O(NNZ + n)</text>
</svg>