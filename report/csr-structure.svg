<rect x="70" y="535" width="1260" height="255" rx="16" fill="#f0fdf4" stroke="#23834a" stroke-width="2"/>
<text x="105" y="580" class="head">각 배열의 의미</text>
<text x="105" y="625" class="txt">data: 0이 아닌 실제 값들을 행 순서대로 저장</text>
<text x="105" y="670" class="txt">indices: data의 각 값이 원래 행렬의 몇 번째 열에 있었는지 저장</text>
<text x="105" y="715" class="txt">indptr: 각 행의 시작 위치와 끝 위치를 지정 (i번째 행은 indptr[i] ~ indptr[i+1]-1)</text>
<text x="105" y="760" class="txt">계산 시 해당 행의 구간만 순회하므로 시간 복잡도 O(NNZ + m), 저장 공간 O(NNZ + m)</text>
</svg>