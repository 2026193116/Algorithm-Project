<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#202938} .title{font-size:25px;font-weight:700} .sub{font-size:15px;fill:#5b6574} .label{font-size:17px;font-weight:600} .small{font-size:14px} .box{fill:#f3f6fa;stroke:#52647a;stroke-width:2} .blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2} .green{fill:#dcfce7;stroke:#15803d;stroke-width:2} .orange{fill:#ffedd5;stroke:#c2410c;stroke-width:2} .line{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)} </style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text x="500" y="42" text-anchor="middle" class="title">실험 행렬 생성: 크기 · 희소도 · 구조</text>
<rect x="330" y="80" width="340" height="65" rx="10" class="blue"/><text x="500" y="120" text-anchor="middle" class="label">조건 입력 (n, density, structure)</text>
<path d="M500 145 V185 M160 185 H840 M160 185 V220 M386 185 V220 M613 185 V220 M840 185 V220" class="line"/>
<rect x="55" y="220" width="210" height="90" rx="10" class="box"/><text x="160" y="255" text-anchor="middle" class="label">Random</text><text x="160" y="282" text-anchor="middle" class="small">전체 위치에서 선택</text>
<rect x="281" y="220" width="210" height="90" rx="10" class="box"/><text x="386" y="255" text-anchor="middle" class="label">Banded</text><text x="386" y="282" text-anchor="middle" class="small">대각선 주변에 배치</text>
<rect x="508" y="220" width="210" height="90" rx="10" class="box"/><text x="613" y="255" text-anchor="middle" class="label">Row</text><text x="613" y="282" text-anchor="middle" class="small">일부 행에 집중</text>
<rect x="735" y="220" width="210" height="90" rx="10" class="box"/><text x="840" y="255" text-anchor="middle" class="label">Block</text><text x="840" y="282" text-anchor="middle" class="small">영역 단위로 집중</text>
<path d="M160 310 V370 H500 M386 310 V370 M613 310 V370 M840 310 V370 H500 V410" class="line"/>
<rect x="330" y="410" width="340" height="80" rx="10" class="green"/><text x="500" y="445" text-anchor="middle" class="label">정확한 NNZ 수만큼 비제로 배치</text><text x="500" y="472" text-anchor="middle" class="small">목표 희소도에 맞춰 재현 가능한 실험 데이터 구성</text></svg>